[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose = "2025.04.01"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
splashscreen = { module = "androidx.core:core-splashscreen", version = "1.0.1" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.4" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.9.0" }
junit = { module = "junit:junit", version = "4.13.2" }
android-test = { module = "androidx.test.ext:junit", version = "1.2.1" }
test-runner = { module = "androidx.test:runner", version = "1.6.2" }
