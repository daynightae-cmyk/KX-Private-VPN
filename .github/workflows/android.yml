name: Native Android
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify local Pro authority
        run: python -B -W error::ResourceWarning -m unittest discover -s backend/pro -p 'test_*.py' -v
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-build-evidence
          path: |
            android/app/build/reports
            android/app/build/outputs/apk
  device:
    runs-on: ubuntu-latest
    # Emulator boot (10m) + APK install (6m) + the current 350-test suite
    # (30m measured upper bound) + evidence upload. Timeouts remain failures.
    # This includes the PR28 VPN/Pro matrix, PR29 Home tests, the 2026-11-08
    # app-inventory/Network Doctor/Download Rescue coverage and the cache tests.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
        include:
          - api: 26
            emulator_gpu_mode: swiftshader_indirect
          - api: 35
            # This mode is supported on Emulator 36.4.10; swiftshader_indirect
            # was deprecated in 36.4.9 and crashes in the CI host RenderThread.
            emulator_gpu_mode: swangle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: Nexus 5
          # Google archive: Emulator 36.4.10 Stable (build 15004761).
          # Current 37.x loses ColorBuffers and exits during API35 dialog rendering.
          emulator-build: 15004761
          # API35 cold boots can exceed three minutes on hosted KVM runners.
          emulator-boot-timeout: 600
          # Actual CI host kernel records RenderThread SIGSEGV and QEMU signal 11;
          # disabling Vulkan did not repair it. Test the supported ANGLE/SwiftShader
          # backend on API35 only; retain the passing API26 renderer unchanged.
          # All 350 API35 instrumented tests remain mandatory.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu ${{ matrix.emulator_gpu_mode }} -skin 720x1280 -camera-back none -camera-front none
          disable-animations: false
          working-directory: android
          script: bash scripts/verify-device.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-device-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            android/app/build/test-results
            android/device-screenshots

  # Release compile gate: the release build type must compile and shrink even
  # without a configured keystore (it falls back to the debug key locally).
  # A keystore-configured signed build is a separate owner-gated release step.
  release-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: bash ./gradlew :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-release-compile
          path: |
            android/app/build/outputs/bundle/release
            android/app/build/outputs/apk/release
