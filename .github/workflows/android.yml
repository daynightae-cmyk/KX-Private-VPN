name: Native Android
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local Pro authority
        run: python -B -W error::ResourceWarning -m unittest discover -s backend/pro -p 'test_*.py' -v
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-evidence
          path: |
            android/app/build/reports
            android/app/build/outputs/apk
  device:
    runs-on: ubuntu-latest
    # Emulator boot (10m) + APK install (6m) + the 252-test suite (18m).
    # Preserve setup and evidence-upload headroom; timeouts remain failures.
    # This includes the PR28 VPN/Pro matrix, PR29 Home tests and the 2026-11-08
    # app-inventory/Network Doctor/Download Rescue coverage.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: Nexus 5
          # Google archive: Emulator 36.4.10 Stable (build 15004761).
          # Current 37.x loses ColorBuffers and exits during API35 dialog rendering.
          emulator-build: 15004761
          # API35 cold boots can exceed three minutes on hosted KVM runners.
          emulator-boot-timeout: 600
          # `-gpu software` renders through guest SwiftShader, which repeatedly killed the
          # emulator mid-suite on push runs (device vanished at test 53 of 138 with an empty
          # failure element). Host-side SwiftShader is the emulator-runner default and keeps
          # the same headless behaviour, so the API35 gate stays a real 138-test run.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -skin 720x1280 -camera-back none -camera-front none
          disable-animations: false
          working-directory: android
          script: bash scripts/verify-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            android/app/build/test-results
            android/device-screenshots

  # Temporary PR40 diagnostic: reproduce the two classes involved in
  # repeated API35 emulator loss in a FRESH, isolated emulator process.
  # The mandatory device(35) full 320-test gate above remains unchanged.
  api35-focused-diagnostic:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 40 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 5
          emulator-build: 15004761
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -skin 720x1280 -camera-back none -camera-front none
          disable-animations: false
          working-directory: android
          script: KX_TEST_CLASS="com.knoux.kxprivatevpn.CacheFlowTest,com.knoux.kxprivatevpn.ClientFlowTest" bash scripts/verify-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-api-35-focused-diagnostic
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            android/device-screenshots
